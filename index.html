<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` deixa o jogo ir até a borda no iPad/iPhone; o recorte
      volta pelas variáveis `env(safe-area-inset-*)` lá embaixo. `user-scalable=no`
      o Safari IGNORA desde o iOS 10 — quem mata o zoom de dois toques é o
      `touch-action` do CSS, não isto aqui.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0f" />
    <!-- Sem isto o navegador pede `/favicon.ico`, leva 404, e o `npm run
         deploy` não pode exigir console limpo — que é o critério dele. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>COMPASSO — round zero</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0b0f;
        color: #6b6b7b;
        font: 12px/1.5 ui-monospace, monospace;
        overflow: hidden;
        /*
         * O trio que o iOS exige para a tela parar de se comportar como
         * página: sem seleção ao segurar o dedo, sem realce azul no toque e
         * sem elástico ao arrastar. `touch-action: none` é o que também
         * desliga o zoom de dois toques, já que a meta tag não desliga.
         */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        /* `100dvh` acompanha a barra do Safari aparecendo e sumindo; o `fixed`
           impede que a própria página role quando ela some. */
        position: fixed;
        inset: 0;
        height: 100dvh;
      }
      #app { position: fixed; inset: 0; }
      /*
       * O buffer é 640x360 de verdade. O tamanho e a POSIÇÃO finais vêm de
       * `main.ts`, que escolhe um múltiplo inteiro em pixels de DISPOSITIVO —
       * em escala fracionária o vizinho-próximo faz uns pixels virarem 2 e
       * outros 3, e a imagem cintila ao rolar.
       */
      #app canvas {
        display: block;
        position: absolute;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #hud {
        position: fixed;
        bottom: calc(6px + env(safe-area-inset-bottom));
        left: calc(8px + env(safe-area-inset-left));
        opacity: 0.5;
        pointer-events: none;
        white-space: pre;
      }

      /* ------------------------------------------------------- toque
       * Tudo daqui para baixo só existe com `html.toque`, ligado por
       * `main.ts` quando o ponteiro é grosso. Em desktop o DOM está aqui e
       * invisível, sem um único ouvinte pendurado.
       */
      #toque { display: none; }
      html.toque #toque {
        display: block;
        position: fixed;
        inset: 0;
        touch-action: none;
        z-index: 2;
      }
      /*
       * No telefone o HUD some por padrão, e isso virou NECESSÁRIO quando a
       * tela passou a ser preenchida: sem tarja preta em cima, a linha de
       * diagnóstico é desenhada POR CIMA da arena e colide com o "FASE 1 ·
       * INFECÇÃO 1" do próprio jogo — dois textos no mesmo lugar. Ele é
       * instrumentação, não interface; `?hud=1` traz de volta.
       *
       * `visibility` e não `display: none`: o rig lê `#hud` por `textContent`
       * para saber a fase e o hash, e um elemento removido do layout continua
       * legível — mas manter a caixa evita depender disso.
       */
      html.toque.sem-hud #hud { visibility: hidden; }
      /* O HUD sobe para o topo: embaixo ele fica debaixo do polegar. */
      html.toque #hud {
        bottom: auto;
        top: calc(4px + env(safe-area-inset-top));
        left: calc(8px + env(safe-area-inset-left));
        right: calc(8px + env(safe-area-inset-right));
        font-size: 10px;
        opacity: 0.38;
        white-space: pre-wrap;
      }
      /* O manche NASCE onde o dedo encosta — daí o `left/top` vir do JS. */
      #manche {
        position: absolute;
        width: 112px;
        height: 112px;
        margin: -56px 0 0 -56px;
        border-radius: 50%;
        border: 2px solid rgba(206, 214, 232, 0.22);
        background: rgba(206, 214, 232, 0.05);
        opacity: 0;
        transition: opacity 120ms linear;
        pointer-events: none;
      }
      #manche.ativo { opacity: 1; }
      #botao-manche {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border-radius: 50%;
        background: rgba(206, 214, 232, 0.3);
      }
      /* Afordância do impulso. O toque vale na metade direita INTEIRA; este
         círculo só conta onde a mão deve ficar. */
      #impulso {
        position: absolute;
        right: calc(28px + env(safe-area-inset-right));
        bottom: calc(28px + env(safe-area-inset-bottom));
        width: 92px;
        height: 92px;
        border-radius: 50%;
        border: 2px solid rgba(206, 214, 232, 0.22);
        background: rgba(206, 214, 232, 0.05);
        pointer-events: none;
        display: grid;
        place-items: center;
        color: rgba(206, 214, 232, 0.5);
        font: 10px/1 ui-monospace, monospace;
        letter-spacing: 0.08em;
      }
      #impulso.ativo {
        background: rgba(206, 214, 232, 0.2);
        border-color: rgba(206, 214, 232, 0.45);
      }
      #tela-cheia {
        position: absolute;
        top: calc(8px + env(safe-area-inset-top));
        right: calc(8px + env(safe-area-inset-right));
        width: 40px;
        height: 40px;
        border-radius: 6px;
        border: 1px solid rgba(206, 214, 232, 0.22);
        background: rgba(11, 11, 15, 0.5);
        color: rgba(206, 214, 232, 0.6);
        font: 16px/1 ui-monospace, monospace;
        display: none;
      }
      html.tem-tela-cheia #tela-cheia { display: block; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="toque">
      <div id="manche"><div id="botao-manche"></div></div>
      <div id="impulso">IMPULSO</div>
      <button id="tela-cheia" type="button" aria-label="tela cheia">⛶</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
